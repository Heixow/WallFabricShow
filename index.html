<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>翻页电子相册</title>
  <!-- 引入 StPageFlip 开源库 CDN -->
  <script src="https://cdn.jsdelivr.net/npm/page-flip@1.1.2/dist/page-flip.browser.min.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background-color: #1a1a1a;
      min-height: 100vh;
      padding: 20px 10px;
      font-family: system-ui, -apple-system, sans-serif;
    }
    h1 {
      color: #fff;
      text-align: center;
      margin-bottom: 24px;
      font-weight: 500;
      font-size: 24px;
    }
    /* 书本容器 */
    #book {
      width: 920px;
      height: 620px;
      max-width: 100%;
      margin: 0 auto;
      background: #fff;
      border-radius: 4px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    }
    /* 单页样式 */
    .photo-page {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #fff;
      overflow: hidden;
    }
    .photo-page img {
      max-width: 95%;
      max-height: 95%;
      object-fit: contain;
    }
    /* 控制栏 */
    .control-bar {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      margin-top: 24px;
      color: #fff;
      font-size: 16px;
    }
    .control-bar button {
      padding: 8px 20px;
      border: none;
      border-radius: 6px;
      background: #3b82f6;
      color: #fff;
      font-size: 15px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .control-bar button:hover {
      background: #2563eb;
    }
    .control-bar button:disabled {
      background: #64748b;
      cursor: not-allowed;
    }
    /* 移动端适配 */
    @media (max-width: 768px) {
      #book {
        width: 100%;
        height: 420px;
      }
    }
  </style>
</head>
<body>
  <h1>我的翻页相册</h1>
  <div id="book"></div>

  <div class="control-bar">
    <button id="prevBtn">上一页</button>
    <span id="pageNum">1 / 1</span>
    <button id="nextBtn">下一页</button>
  </div>

  <script>
    // ===================== 配置区（修改这里即可） =====================
    // 图片路径：将图片放入 images 文件夹，按顺序填写文件名
    const photoList = [
    "images/01.jpg",
    "images/02.jpg",
    "images/03.jpg",
    "images/04.jpg",
    "images/05.jpg", 
    "images/06.jpg",
    "images/07.jpg",
    "images/08.jpg",
    "images/09.jpg",
    "images/10.jpg",
    "images/11.jpg",
    "images/12.jpg",
    "images/13.jpg",
    "images/14.jpg",
    "images/15.jpg",
    "images/16.jpg",
    "images/17.jpg",
    "images/18.jpg",
    "images/19.jpg",
    "images/20.jpg",
    "images/21.jpg",
    "images/22.jpg",
    "images/23.jpg",
    "images/24.jpg",
    "images/25.jpg",
    "images/26.jpg",
    "images/27.jpg",
    ];

    // 翻页效果配置
    const flipConfig = {
      width: 920,          // 书本宽度（px）
      height: 620,         // 书本高度（px）
      showCover: false,    // 是否显示单独封面（true=第一页为封面，单独显示）
      clickEvent: true,    // 点击书页边缘翻页
      mobileScrollSupport: true, // 移动端支持滑动翻页
      swipeDistance: 30    // 滑动触发翻页的最小距离
    };
    // ================================================================

    // 页面加载完成后初始化
    document.addEventListener("DOMContentLoaded", function () {
      const bookEl = document.getElementById("book");
      const prevBtn = document.getElementById("prevBtn");
      const nextBtn = document.getElementById("nextBtn");
      const pageNumEl = document.getElementById("pageNum");

      // 动态生成所有书页
      photoList.forEach(function (imgSrc) {
        const pageDiv = document.createElement("div");
        pageDiv.className = "photo-page";
        pageDiv.innerHTML = `<img src="${imgSrc}" alt="相册图片" loading="lazy">`;
        bookEl.appendChild(pageDiv);
      });

      // 初始化 StPageFlip 实例
      const pageFlip = new St.PageFlip(bookEl, flipConfig);

      // 更新页码与按钮状态
      function updatePageState() {
        const currentIndex = pageFlip.getCurrentPageIndex();
        const totalPages = pageFlip.getPageCount();
        pageNumEl.textContent = `${currentIndex + 1} / ${totalPages}`;
        prevBtn.disabled = currentIndex <= 0;
        nextBtn.disabled = currentIndex >= totalPages - 1;
      }

      // 按钮翻页
      prevBtn.addEventListener("click", function () {
        pageFlip.flipPrev();
      });
      nextBtn.addEventListener("click", function () {
        pageFlip.flipNext();
      });

      // 监听翻页结束事件，更新状态
      pageFlip.on("flip-end", updatePageState);

      // 初始化状态
      updatePageState();
    });
  </script>
</body>
</html>
