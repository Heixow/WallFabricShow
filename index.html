<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>翻页电子相册</title>
  <!-- 本地引入 2.0.7 版本库文件 -->
  <script src="./page-flip.browser.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background-color: #1a1a1a;
      min-height: 100vh;
      padding: 20px 10px;
      font-family: system-ui, -apple-system, sans-serif;
    }
    h1 {
      color: #fff;
      text-align: center;
      margin-bottom: 24px;
      font-weight: 500;
      font-size: 24px;
    }
    #book {
      width: 920px;
      height: 620px;
      max-width: 100%;
      margin: 0 auto;
      background: #fff;
      border-radius: 4px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    }
    .photo-page img {
      max-width: 95%;
      max-height: 95%;
      object-fit: contain;
    }
    .control-bar {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      margin-top: 24px;
      color: #fff;
      font-size: 16px;
    }
    .control-bar button {
      padding: 8px 20px;
      border: none;
      border-radius: 6px;
      background: #3b82f6;
      color: #fff;
      font-size: 15px;
      cursor: pointer;
    }
    .control-bar button:disabled {
      background: #64748b;
      cursor: not-allowed;
    }
    @media (max-width: 768px) {
      #book {
        width: 100%;
        height: 420px;
      }
    }
  </style>
</head>
<body>
  <h1>我的翻页相册</h1>
  <div id="book"></div>

  <div class="control-bar">
    <button id="prevBtn">上一页</button>
    <span id="pageNum">1 / 1</span>
    <button id="nextBtn">下一页</button>
  </div>

  <script>
    // ===================== 配置区 =====================
    const photoList = [
    "images/01.jpg",
    "images/02.jpg",
    "images/03.jpg",
    "images/04.jpg",
    "images/05.jpg", 
    "images/06.jpg",
    "images/07.jpg",
    "images/08.jpg",
    "images/09.jpg",
    "images/10.jpg",
    "images/11.jpg",
    "images/12.jpg",
    "images/13.jpg",
    "images/14.jpg",
    "images/15.jpg",
    "images/16.jpg",
    "images/17.jpg",
    "images/18.jpg",
    "images/19.jpg",
    "images/20.jpg",
    "images/21.jpg",
    "images/22.jpg",
    "images/23.jpg",
    "images/24.jpg",
    "images/25.jpg",
    "images/26.jpg",
    "images/27.jpg",
    ];

    const flipConfig = {
      width: 920,
      height: 620,
      showCover: false,
      clickEvent: true,
      mobileScrollSupport: true,
      swipeDistance: 30
    };
    // =================================================

    document.addEventListener("DOMContentLoaded", function () {
      const bookEl = document.getElementById("book");
      const prevBtn = document.getElementById("prevBtn");
      const nextBtn = document.getElementById("nextBtn");
      const pageNumEl = document.getElementById("pageNum");

      // 2.x 版本：先创建实例，再调用 loadFromImages 加载图片
      const pageFlip = new St.PageFlip(bookEl, flipConfig);
      pageFlip.loadFromImages(photoList);

      // 更新页码与按钮状态
      function updatePageState() {
        const currentIndex = pageFlip.getCurrentPageIndex();
        const totalPages = pageFlip.getPageCount();
        pageNumEl.textContent = `${currentIndex + 1} / ${totalPages}`;
        prevBtn.disabled = currentIndex <= 0;
        nextBtn.disabled = currentIndex >= totalPages - 1;
      }

      // 按钮绑定
      prevBtn.addEventListener("click", function () {
        pageFlip.flipPrev();
      });
      nextBtn.addEventListener("click", function () {
        pageFlip.flipNext();
      });

      // 2.x 版本：监听事件，初始化完成和翻页结束时更新状态
      pageFlip.on("init", updatePageState);
      pageFlip.on("flip", updatePageState);
    });
  </script>
</body>
</html>
